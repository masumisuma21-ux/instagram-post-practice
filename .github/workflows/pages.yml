name: Publish carousel tool to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare only website files
        run: |
          mkdir -p _site/mp4-export _site/vendor/mp4
          cp product-plan-model.js product-plan-editor.js product-plan.css index.html video-captions.js video-timeline.js video-model.js video-editor.js video-editor.css feed-heading-editor.js feed-heading-editor.css feed-photo-editor.js feed-photo-editor.css image-tools.js accounts.js accounts.css style.css app.js reels.js reels.css reel-script-templates.js sans.woff serif.woff FONT-LICENSE.txt .nojekyll _site/
          cp mp4-export/exporter.mjs mp4-export/audio.mjs mp4-export/diagnostics.mjs _site/mp4-export/
          cp vendor/mp4/mediabunny-1.63.0.min.mjs vendor/mp4/MEDIABUNNY-LICENSE.txt vendor/mp4/NOTICE.md _site/vendor/mp4/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
